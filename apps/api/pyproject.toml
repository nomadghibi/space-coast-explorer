[project]
name = "space-coast-explorer-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["alembic>=1.17.0", "fastapi>=0.122.0", "psycopg[binary]>=3.2.0", "pydantic-settings>=2.12.0", "sqlalchemy>=2.0.0", "structlog>=25.0.0", "uvicorn>=0.38.0"]

[project.optional-dependencies]
dev = ["httpx>=0.28.0", "mypy>=1.18.0", "pytest>=9.0.0", "ruff>=0.14.0"]

[dependency-groups]
dev = ["httpx>=0.28.0", "mypy>=1.18.0", "pytest>=9.0.0", "ruff>=0.14.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
